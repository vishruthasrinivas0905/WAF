version: '3.8'

services:
  # ============================================================================
  # 1. AppAware WAF Gateway (Reverse Proxy & Deep Inspection Engine)
  # ============================================================================
  waf-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appaware_waf_gateway
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WAF_MODE=ENFORCING
      - UPSTREAM_URL=http://upstream-vulnerable-app:3000
      - ADAPTATION_BUDGET=500
    depends_on:
      - upstream-vulnerable-app
    networks:
      - waf_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/waf/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 2. Live Vulnerable Upstream Target (OWASP Juice Shop)
  # ============================================================================
  upstream-vulnerable-app:
    image: bkimminich/juice-shop:latest
    container_name: juice_shop_upstream
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - waf_net

networks:
  waf_net:
    driver: bridge
