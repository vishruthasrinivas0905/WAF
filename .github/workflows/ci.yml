name: AppAware-WAF CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    name: Test, Benchmark & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Execute Python Unit Tests
        run: python -m unittest discover tests -v

      - name: Execute HTTP Method Attack Matrix
        run: python scripts/live_attack_tester.py --pipeline

      - name: Execute Automated 1,450-Payload Benchmark
        run: python scripts/benchmark_waf.py

      - name: Build Web Application & Gateway
        run: npm run build

      - name: Validate Container Build
        run: docker build -t appaware-waf:ci .
