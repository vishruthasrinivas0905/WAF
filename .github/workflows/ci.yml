name: AppAware-WAF CI Pipeline

on:
  push:
    branches: [ main, master, "codex/**", vishrutha ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    name: Tests, Smoke Benchmark & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Execute Python Unit Tests
        run: python -m unittest discover tests -v

      - name: Run Local Attack Regression Vectors
        run: python scripts/live_attack_tester.py --pipeline

      - name: Run Handcrafted Smoke Benchmark
        run: python scripts/benchmark_waf.py

      - name: Type Check
        run: npm run lint

      - name: Build Web Application & Gateway
        run: npm run build

      - name: Validate Container Build
        run: docker build -t appaware-waf:ci .

      - name: Validate Compose Configuration
        env:
          WAF_ADMIN_TOKEN: ci-only-temporary-secret-value-0123456789
        run: docker compose --profile baseline config --quiet
